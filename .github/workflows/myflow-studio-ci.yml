name: MyFlow Studio CI

on:
  push:
    branches: [master, main]
    paths: ["myflow-studio/**", ".github/workflows/myflow-studio-ci.yml"]
  pull_request:
    paths: ["myflow-studio/**", ".github/workflows/myflow-studio-ci.yml"]

defaults:
  run:
    working-directory: myflow-studio

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myflow-studio/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
